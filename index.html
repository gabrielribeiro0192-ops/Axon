<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Dinâmicos</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-front: #161b22;
            --card-back: #1f6feb;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        nav {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            background: #21262d;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        nav a:hover {
            background: #30363d;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 480px;
        }

        .card-perspective {
            perspective: 1000px;
            width: 100%;
            height: 280px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .card-front {
            background-color: var(--card-front);
            color: var(--text-main);
        }

        .card-back {
            background-color: var(--card-back);
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .card-face h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .card-hint {
            font-size: 0.8rem;
            color: var(--text-sub);
            position: absolute;
            bottom: 16px;
        }

        .card-back .card-hint {
            color: rgba(255, 255, 255, 0.7);
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #2ea043;
        }

        .btn-sec {
            background-color: #21262d;
            border: 1px solid var(--border-color);
        }

        .btn-sec:hover {
            background-color: #30363d;
        }

        .counter {
            font-size: 0.9rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <nav>
        <a href="data.html">⚙️ Base de Dados (data)</a>
    </nav>

    <div class="container">
        <div class="counter" id="counter">Carregando...</div>

        <div class="card-perspective" onclick="toggleCard()">
            <div class="card" id="flashcard">
                <div class="card-face card-front">
                    <h2 id="card-question">Carregando...</h2>
                    <span class="card-hint">Clique para ver a resposta</span>
                </div>
                <div class="card-face card-back">
                    <h2 id="card-answer">...</h2>
                    <span class="card-hint">Clique para voltar à pergunta</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-sec" onclick="prevCard()">Anterior</button>
            <button class="btn" onclick="nextCard()">Próximo</button>
            <button class="btn btn-sec" onclick="shuffleCards()">Embaralhar</button>
        </div>
    </div>

    <script>
        // Dados padrão caso o usuário ainda não tenha salvo nada
        const defaultRawData = 
`O que é API? | Interface de comunicação entre sistemas diferentes
O que é JSON? | Formato leve de troca de dados estruturado em chave e valor
Qual a vantagem do GitHub Pages? | Hospedagem estática gratuita com deploy automático direto do repositório`;

        let cards = [];
        let currentIndex = 0;

        function loadData() {
            let stored = localStorage.getItem('flashcards_data');
            if (!stored) {
                stored = defaultRawData;
                localStorage.setItem('flashcards_data', stored);
            }

            // Interpreta cada linha com separador pipe (|) ou ponto e vírgula (;)
            cards = stored.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0 && (line.includes('|') || line.includes(';')))
                .map(line => {
                    const sep = line.includes('|') ? '|' : ';';
                    const [q, ...a] = line.split(sep);
                    return { question: q.trim(), answer: a.join(sep).trim() };
                });

            if (cards.length === 0) {
                cards = [{ question: "Nenhum card cadastrado", answer: "Acesse a página 'data' para adicionar linhas no formato: Pergunta | Resposta" }];
            }

            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            const cardEl = document.getElementById('flashcard');
            cardEl.classList.remove('flipped');

            setTimeout(() => {
                const cur = cards[currentIndex];
                document.getElementById('card-question').innerText = cur.question;
                document.getElementById('card-answer').innerText = cur.answer;
                document.getElementById('counter').innerText = `Card ${currentIndex + 1} de ${cards.length}`;
            }, 150);
        }

        function toggleCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % cards.length;
            renderCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            renderCard();
        }

        function shuffleCards() {
            cards.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            renderCard();
        }

        window.onload = loadData;
    </script>
</body>
</html>
