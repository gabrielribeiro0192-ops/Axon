<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Dados - Flashcards</title>
    <!-- Biblioteca PDF.js da Mozilla para leitura direta no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #f0f6fc;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
        }

        a.back-btn {
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.95rem;
        }

        a.back-btn:hover {
            text-decoration: underline;
        }

        .instructions {
            font-size: 0.9rem;
            color: #8b949e;
            line-height: 1.5;
        }

        code {
            background: #161b22;
            padding: 2px 6px;
            border-radius: 4px;
            color: #79c0ff;
        }

        /* Área de Upload de PDF */
        .pdf-upload-box {
            background-color: #161b22;
            border: 2px dashed #30363d;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .pdf-upload-box:hover {
            border-color: #58a6ff;
        }

        .pdf-info {
            font-size: 0.9rem;
            color: #c9d1d9;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-btn {
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .custom-file-btn:hover {
            background-color: #30363d;
        }

        textarea {
            width: 100%;
            height: 380px;
            background-color: #161b22;
            color: #f0f6fc;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            font-family: "Consolas", "Courier New", monospace;
        }

        textarea:focus {
            border-color: #58a6ff;
        }

        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-save {
            background-color: #238636;
            color: white;
        }

        .btn-save:hover {
            background-color: #2ea043;
        }

        .btn-clear {
            background-color: #21262d;
            color: #f85149;
            border: 1px solid #30363d;
        }

        .btn-clear:hover {
            background-color: #b62324;
            color: white;
        }

        #status {
            font-size: 0.9rem;
            font-weight: 500;
            color: #3fb950;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Base de Dados dos Flashcards</h2>
            <a href="index.html" class="back-btn">← Voltar aos Flashcards</a>
        </div>

        <!-- Seção de Importação de PDF -->
        <div class="pdf-upload-box">
            <div class="pdf-info">
                📄 <b>Carregar via PDF:</b> Selecione um arquivo para extrair o texto automaticamente.
            </div>
            <div>
                <label for="pdf-input" class="custom-file-btn">Escolher PDF</label>
                <input type="file" id="pdf-input" accept="application/pdf" onchange="handlePdfUpload(event)">
            </div>
        </div>

        <p class="instructions">
            Edite ou revise as linhas abaixo. Cada card deve estar em uma linha no padrão: <code>Pergunta | Resposta</code>
        </p>

        <textarea id="data-input" placeholder="Pergunta 1 | Resposta 1&#10;Pergunta 2 | Resposta 2"></textarea>

        <div class="actions">
            <button class="btn-save" onclick="saveData()">💾 Salvar Dados</button>
            <button class="btn-clear" onclick="clearData()">Limpar Tudo</button>
            <span id="status">Salvo com sucesso!</span>
        </div>
    </div>

    <script>
        // Configura o worker do PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const input = document.getElementById('data-input');
        const status = document.getElementById('status');

        // Carrega os dados salvos previamente
        window.onload = () => {
            const saved = localStorage.getItem('flashcards_data');
            if (saved) {
                input.value = saved;
            }
        };

        // Extrai texto de todas as páginas do PDF
        async function handlePdfUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            showStatus('Lendo arquivo PDF...', '#58a6ff');

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = '';

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    const pageStrings = textContent.items.map(item => item.str);
                    fullText += pageStrings.join(' ') + '\n';
                }

                // Adiciona o texto extraído ao campo
                if (input.value.trim().length > 0) {
                    input.value += '\n' + fullText.trim();
                } else {
                    input.value = fullText.trim();
                }

                showStatus('Texto do PDF importado! Clique em Salvar.', '#3fb950');
            } catch (err) {
                console.error(err);
                showStatus('Erro ao ler o PDF. Verifique o arquivo.', '#f85149');
            } finally {
                // Reseta o input para permitir carregar o mesmo arquivo se quiser
                event.target.value = '';
            }
        }

        function saveData() {
            localStorage.setItem('flashcards_data', input.value);
            showStatus('Salvo com sucesso!', '#3fb950');
        }

        function clearData() {
            if (confirm('Tem certeza que deseja apagar todo o conteúdo atual?')) {
                input.value = '';
                localStorage.removeItem('flashcards_data');
                showStatus('Dados apagados!', '#f85149');
            }
        }

        function showStatus(message, color) {
            status.innerText = message;
            status.style.color = color;
            status.style.opacity = '1';
            setTimeout(() => {
                status.style.opacity = '0';
            }, 3000);
        }
    </script>
</body>
</html>
